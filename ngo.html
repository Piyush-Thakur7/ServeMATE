<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ServeMate NGO Partner</title>
  <meta name="description" content="Verified ServeMate NGO partner page on resence.in with transparent proof of work and impact updates.">
  <style>
    :root { --blue:#2563eb; --orange:#f97316; --ink:#0f172a; --muted:#64748b; --line:#e2e8f0; --bg:#f8fafc; --card:#fff; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Inter,system-ui,Segoe UI,sans-serif; background:var(--bg); color:var(--ink); }
    .hero { min-height:58vh; display:grid; align-items:end; background:linear-gradient(135deg,#dbeafe,#fff7ed); position:relative; overflow:hidden; }
    .hero img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:.22; }
    .hero-inner { position:relative; max-width:1080px; width:100%; margin:0 auto; padding:72px 24px 42px; }
    .badge { display:inline-flex; border-radius:999px; background:#dcfce7; color:#166534; padding:6px 11px; font-weight:800; font-size:13px; margin-bottom:12px; }
    h1 { font-size:clamp(34px,7vw,70px); line-height:.95; margin:0 0 14px; letter-spacing:0; }
    p { color:var(--muted); line-height:1.7; }
    main { max-width:1080px; margin:0 auto; padding:24px; display:grid; gap:18px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:14px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:18px; box-shadow:0 8px 28px rgba(15,23,42,.05); }
    .metric { font-size:30px; font-weight:900; color:var(--blue); }
    a.button { display:inline-flex; border-radius:8px; padding:12px 16px; background:var(--orange); color:#fff; text-decoration:none; font-weight:900; }
    header { position:absolute; top:0; left:0; right:0; padding:18px 24px; z-index:2; display:flex; justify-content:space-between; }
    header a { color:#0f172a; font-weight:900; text-decoration:none; }
  </style>
</head>
<body>
  <section class="hero">
    <header><a href="https://resence.in">ServeMate</a><a href="https://resence.in/ngos">NGO Network</a></header>
    <img id="banner" alt="">
    <div class="hero-inner">
      <div class="badge">Verified ServeMate NGO</div>
      <h1 id="name">NGO Partner</h1>
      <p id="motive">Loading verified NGO impact profile...</p>
      <a class="button" id="donate" href="https://resence.in">Support this NGO</a>
    </div>
  </section>
  <main>
    <section class="grid">
      <div class="card"><div class="metric" id="tasksDone">0</div><p>Verified tasks completed</p></div>
      <div class="card"><div class="metric" id="impactScore">0</div><p>ServeMate impact score</p></div>
      <div class="card"><div class="metric" id="rating">0</div><p>Community rating</p></div>
    </section>
    <section class="card">
      <h2>About</h2>
      <p id="description"></p>
      <p id="location"></p>
    </section>
    <section class="card">
      <h2>Verified Work</h2>
      <div id="work"></div>
    </section>
  </main>
  <script>
    function slugFromHost() {
      const host = location.hostname.toLowerCase();
      if (host.includes('.')) return host.split('.')[0];
      return new URLSearchParams(location.search).get('slug') || '';
    }
    async function loadNgo() {
      const slug = slugFromHost();
      const res = await fetch(`/api/ngo-site/${slug}`);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'NGO site not found');
      const ngo = data.ngo;
      document.title = `${ngo.name} | ServeMate Verified NGO`;
      document.querySelector('meta[name="description"]').setAttribute('content', `${ngo.name} is a verified ServeMate NGO partner. View transparent work proof and impact updates.`);
      document.getElementById('name').textContent = ngo.name;
      document.getElementById('motive').textContent = ngo.about || ngo.description || 'Transparent work, verified by ServeMate.';
      document.getElementById('description').textContent = ngo.description || ngo.about || 'This NGO profile is maintained by the verified partner team.';
      document.getElementById('location').textContent = ngo.location ? `Location: ${ngo.location}` : '';
      document.getElementById('tasksDone').textContent = ngo.tasksCompleted || 0;
      document.getElementById('impactScore').textContent = ngo.impactScore || 0;
      document.getElementById('rating').textContent = ngo.rating || 0;
      if (ngo.banner) document.getElementById('banner').src = ngo.banner;
      document.getElementById('donate').href = ngo.contact?.website || 'https://resence.in';
      const workItems = (data.updates || []).concat(data.tasks || []);
      document.getElementById('work').innerHTML = workItems.length ? workItems.map(task => `<article class="card"><strong>${task.title || task.cause?.title || 'Verified work'}</strong><p>${task.note || task.description || task.proofNote || ''}</p><p>${task.location || ''}</p>${task.proofUrl || task.proofVideo ? `<a href="${task.proofUrl || task.proofVideo}" target="_blank" rel="noopener">View proof</a>` : ''}</article>`).join('') : '<p>No verified work published yet.</p>';
    }
    loadNgo().catch(err => {
      document.getElementById('name').textContent = 'NGO site unavailable';
      document.getElementById('motive').textContent = err.message;
      document.getElementById('donate').style.display = 'none';
    });
  </script>
</body>
</html>
